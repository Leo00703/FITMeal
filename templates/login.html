{% extends "base.html" %}

{% block title %}FitMeal Planner - Login{% endblock %}

{% block content %}
<div class="container" style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="glass-card" style="max-width: 400px; width: 100%; padding: 3rem;">
        <h2 style="text-align: center; margin-bottom: 2rem;">Welcome Back</h2>
        
        {% if error %}
        <div style="background: rgba(255, 0, 0, 0.1); color: #c53030; padding: 0.75rem; border-radius: 8px; margin-bottom: 1.5rem; text-align: center;">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="username">Username / Email</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-filled" style="width: 100%; margin-top: 1rem;">Login</button>
        </form>
        
        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
            Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--color-accent); font-weight: 600;">Register</a>
        </p>
    </div>
</div>
{% endblock %}
