{% extends "base.html" %}

{% block title %}FitMeal Planner - Create Plan{% endblock %}

{% block content %}
<div class="container" style="padding-top: 2rem; padding-bottom: 2rem;">
    <div class="glass-card" style="max-width: 600px; margin: 0 auto;">
        <h2 style="text-align: center; margin-bottom: 2rem;">Design Your Week</h2>
        
        <form id="plannerForm" action="{{ url_for('generate_plan') }}" method="POST">
            <!-- Core Preferences -->
            <div class="form-group">
                <label for="goal">Fitness Goal</label>
                <input type="text" id="goal" name="goal" placeholder="e.g., Lose weight, Build muscle, Eat healthier" required>
            </div>

            <div class="form-group">
                <label for="diet">Diet Type</label>
                <select id="diet" name="diet">
                    <option value="balanced">Balanced</option>
                    <option value="keto">Keto</option>
                    <option value="vegan">Vegan</option>
                    <option value="vegetarian">Vegetarian</option>
                    <option value="paleo">Paleo</option>
                    <option value="mediterranean">Mediterranean</option>
                </select>
            </div>

            <div class="form-group">
                <label for="allergies">Allergies / Exclusions</label>
                <input type="text" id="allergies" name="allergies" placeholder="e.g., Peanuts, Gluten, Dairy">
            </div>

            <div class="form-group">
                <label for="meals_per_day">Meals per Day</label>
                <select id="meals_per_day" name="meals_per_day">
                    <option value="3">3 (Breakfast, Lunch, Dinner)</option>
                    <option value="4">4 (+ Snack)</option>
                    <option value="5">5 (+ 2 Snacks)</option>
                </select>
            </div>

            <!-- Advanced Options Accordion -->
            <details style="margin-bottom: 1.5rem; cursor: pointer;">
                <summary style="font-weight: 600; color: var(--color-accent); margin-bottom: 1rem;">Advanced Settings</summary>
                <div style="padding-left: 1rem; border-left: 2px solid rgba(255,255,255,0.5);">
                    <div class="form-group">
                        <label for="creativity">AI Creativity</label>
                        <input type="range" id="creativity" name="creativity" min="0" max="1" step="0.1" value="0.7">
                        <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--color-text-muted);">
                            <span>Safe</span>
                            <span>Creative</span>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="cuisine">Preferred Cuisine</label>
                        <input type="text" id="cuisine" name="cuisine" placeholder="e.g., Italian, Asian, Mexican">
                    </div>
                </div>
            </details>

            <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem;">Generate Plan</button>
        </form>
    </div>
</div>

<!-- AI Generation State Overlay (Hidden by default) -->
<div id="loadingOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); backdrop-filter: blur(5px); z-index: 1000; align-items: center; justify-content: center;">
    <div class="glass-card" style="text-align: center; max-width: 400px;">
        <div class="spinner" style="margin: 0 auto 1.5rem; width: 50px; height: 50px; border: 4px solid rgba(107, 70, 193, 0.2); border-top-color: var(--color-accent); border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <h3>Generating your plan...</h3>
        <p style="color: var(--color-text-muted); margin-bottom: 1.5rem;">Powered by AI — Model: GPT-OSS:120b</p>
        <button type="button" class="btn btn-secondary" onclick="window.location.reload()">Cancel</button>
    </div>
</div>

<style>
@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>

{% endblock %}

{% block scripts %}
<script>
    document.getElementById('plannerForm').addEventListener('submit', function() {
        document.getElementById('loadingOverlay').style.display = 'flex';
    });
</script>
{% endblock %}
